<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivilOps | Site Assets</title><style>body{font:15px system-ui;background:#0d1723;color:#eaf1f8;margin:0}header{background:#172b3d;padding:18px}main{max-width:1100px;margin:auto;padding:18px}a{color:#9acbff}h1{margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#172b3d;border:1px solid #345;border-radius:12px;padding:16px;margin:12px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;background:#102337;color:white;border:1px solid #567;border-radius:7px;margin:6px 0 14px}button{padding:10px 14px;background:#1976d2;color:white;border:0;border-radius:8px;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#405469}small,label{color:#b5c3d2}label{font-size:13px}.pill{padding:5px 10px;border-radius:20px;background:#35546c;display:inline-block;font-size:12px}.muted{color:#b5c3d2}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #345;text-align:left}.metric{font-size:25px;font-weight:bold}</style></head><body><header><strong>⚙ CIVILOPS</strong> / Site Assets & Attachments</header><main><nav><a href="index.html">Equipment Management</a> · <a href="finances.html">Equipment Finances</a></nav><h1>Site Assets & Attachments</h1><p class="muted">Track pumps, Conex containers, attachments, and other assets without hour-meter requirements. Demo data stays in this browser only.</p><div class="grid"><div><label>Project</label><select id="project" onchange="selected='';render()"><option>Demo Solar</option><option>Demo BESS</option></select></div><div><label>Filter by category</label><select id="filter" onchange="render()"><option value="">All categories</option><option>Pump</option><option>Conex / Container</option><option>Attachment</option><option>Other Site Asset</option></select></div></div><button onclick="showNew()">+ Add Site Asset</button><div id="metrics" class="grid"></div><div id="list"></div><div id="detail"></div></main><script>
const ASSET_KEY='civilops-site-assets-v01',EQUIP_KEY='civilops-demo-v02';let assets=JSON.parse(localStorage.getItem(ASSET_KEY)||'[]');let selected='';const el=id=>document.getElementById(id),v=id=>el(id).value,day=()=>new Date().toISOString().slice(0,10),stamp=()=>new Date().toISOString(),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),eq=()=>JSON.parse(localStorage.getItem(EQUIP_KEY)||'[]'),onSite=a=>a.status==='On Site'||a.status==='Awaiting Pickup';function save(){localStorage.setItem(ASSET_KEY,JSON.stringify(assets));render()}function log(a,type,note){a.events.unshift({at:stamp(),type,note})}function equipName(id){let e=eq().find(x=>x.id===id);return e?'#'+e.number+' — '+e.name:'Not assigned'}function opts(){return '<option value="">None / Standalone</option>'+eq().filter(x=>x.project===v('project')&&x.status!=='Off Site').map(x=>'<option value="'+safe(x.id)+'">#'+safe(x.number)+' — '+safe(x.name)+'</option>').join('')}function finance(a){return a.finance||(a.finance={rate:0,frequency:'Monthly',mob:0,demob:0,release:'',payments:[]})}function rental(a){let f=finance(a),off=a.events.find(x=>x.type==='Call Off'),end=off?off.at.slice(0,10):(f.release||day()),days=Math.max(0,Math.ceil((new Date(end+'T12:00:00')-new Date(a.arrival+'T12:00:00'))/86400000));return f.frequency==='One-time'?+f.rate:+f.rate*days/({Daily:1,Weekly:7,Monthly:30.4375}[f.frequency]||7)}function forecast(a){let f=finance(a);return rental(a)+(+f.mob)+(+f.demob)}function paid(a){return finance(a).payments.reduce((sum,p)=>sum+Number(p.amount),0)}
function render(){let list=assets.filter(a=>a.project===v('project')&&(!v('filter')||a.category===v('filter')));el('metrics').innerHTML=[['Tracked assets',list.length],['On site',list.filter(onSite).length],['Attachments assigned',list.filter(a=>a.category==='Attachment'&&a.equipmentId).length]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="metric">'+x[1]+'</div></div>').join('');el('list').innerHTML='<div class="card"><h2>Inventory</h2>'+(list.length?list.map(a=>'<div class="card"><b>'+safe(a.tag)+' — '+safe(a.name)+'</b><p class="muted">'+safe(a.category)+' · '+safe(a.vendor)+' · <span class="pill">'+safe(a.status)+'</span></p>'+(a.category==='Attachment'?'<p>Assigned machine: '+safe(equipName(a.equipmentId))+'</p>':'')+'<button onclick="openAsset(\''+a.id+'\')">Manage Asset</button></div>').join(''):'<p>No assets yet. Add a pump, Conex, or attachment to begin.</p>')+'</div>';if(selected){let a=list.find(x=>x.id===selected);if(a)details(a);else el('detail').innerHTML=''}}
function showNew(){selected='';el('detail').innerHTML='<div class="card"><h2>Add Site Asset</h2><form id="newAsset"><div class="grid"><div><label>Site asset ID (e.g. P-001)</label><input id="tag" required maxlength="32"></div><div><label>Description</label><input id="name" required></div><div><label>Category</label><select id="category"><option>Pump</option><option>Conex / Container</option><option>Attachment</option><option>Other Site Asset</option></select></div><div><label>Vendor / owner</label><input id="vendor" required></div><div><label>Arrival date</label><input type="date" id="arrival" required value="'+day()+'"></div><div><label>Associated machine (optional)</label><select id="machine">'+opts()+'</select></div></div><button>Add Asset</button></form></div>';el('newAsset').onsubmit=e=>{e.preventDefault();let tag=v('tag').trim();if(assets.some(a=>a.project===v('project')&&a.tag.toLowerCase()===tag.toLowerCase()&&a.status!=='Off Site'))return alert('That site asset ID is already active on this project');let a={id:'asset-'+Date.now(),project:v('project'),tag,name:v('name'),category:v('category'),vendor:v('vendor'),arrival:v('arrival'),equipmentId:v('machine'),status:'On Site',events:[]};log(a,'Arrived / Called On','Assigned machine: '+equipName(a.equipmentId));assets.push(a);selected=a.id;save()}}
function openAsset(id){selected=id;render();el('detail').scrollIntoView({behavior:'smooth'})}
function details(a){let f=finance(a);el('detail').innerHTML='<div class="card"><h2>'+safe(a.tag)+' — '+safe(a.name)+'</h2><p>'+safe(a.category)+' · '+safe(a.status)+' · '+safe(a.vendor)+'</p><p class="muted">Arrived '+safe(a.arrival)+' · Machine: '+safe(equipName(a.equipmentId))+'</p><h3>Assignment & Status</h3><form id="assignment"><div class="grid"><div><label>Associated machine</label><select id="machine">'+opts()+'</select></div><div><label>Change status</label><select id="status"><option>On Site</option><option>Awaiting Pickup</option><option>Off Site</option></select></div><div><label>Change notes</label><input id="note" placeholder="Transfer / condition / pickup notes"></div></div><button>Save Assignment / Status</button></form><h3>Financial Projection</h3><form id="cost"><div class="grid"><div><label>Rental rate ($)</label><input type="number" min="0" step=".01" id="rate" value="'+f.rate+'" required></div><div><label>Frequency</label><select id="frequency">'+['Daily','Weekly','Monthly','One-time'].map(x=>'<option '+(x===f.frequency?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>Projected release</label><input type="date" id="release" value="'+safe(f.release||day())+'" required></div><div><label>Mobilization cost ($)</label><input type="number" min="0" step=".01" id="mob" value="'+f.mob+'" required></div><div><label>Demobilization cost ($)</label><input type="number" min="0" step=".01" id="demob" value="'+f.demob+'" required></div></div><button>Save Asset Forecast</button></form><div class="grid"><div class="card"><small>Projected total</small><div class="metric">'+money(forecast(a))+'</div></div><div class="card"><small>Paid</small><div class="metric">'+money(paid(a))+'</div></div><div class="card"><small>Cost to complete</small><div class="metric">'+money(forecast(a)-paid(a))+'</div></div></div><h3>Log Payment</h3><form id="payment"><div class="grid"><div><label>Type</label><select id="paytype"><option>Rental</option><option>Mobilization</option><option>Demobilization</option><option>Other</option></select></div><div><label>Amount ($)</label><input id="amount" type="number" min=".01" step=".01" required></div><div><label>Payment date</label><input id="paydate" type="date" value="'+day()+'" required></div><div><label>Invoice reference</label><input id="reference"></div></div><button>Log Payment</button></form><h3>Payment History</h3>'+f.payments.map(p=>'<p>'+safe(p.date)+' · '+safe(p.type)+' · '+money(p.amount)+' · '+safe(p.reference)+'</p>').join('')+'<h3>Asset History</h3>'+a.events.map(x=>'<div class="card"><b>'+safe(x.type)+'</b><p><small>'+new Date(x.at).toLocaleString()+'</small></p><p>'+safe(x.note)+'</p></div>').join('')+'</div>';
el('machine').value=a.equipmentId||'';el('status').value=a.status;
el('assignment').onsubmit=e=>{e.preventDefault();let old=equipName(a.equipmentId),prev=a.status,newMachine=v('machine'),newStatus=v('status');if(newMachine!==a.equipmentId){a.equipmentId=newMachine;log(a,'Machine Assignment',old+' → '+equipName(newMachine)+'; '+v('note'))}if(newStatus!==prev){a.status=newStatus;log(a,newStatus==='Awaiting Pickup'?'Call Off':newStatus==='Off Site'?'Pickup Confirmed':'Status Changed',prev+' → '+newStatus+'; '+v('note'))}save()};
el('cost').onsubmit=e=>{e.preventDefault();if(v('release')<a.arrival)return alert('Projected release must be after arrival');Object.assign(f,{rate:+v('rate'),frequency:v('frequency'),release:v('release'),mob:+v('mob'),demob:+v('demob')});save()};
el('payment').onsubmit=e=>{e.preventDefault();f.payments.push({type:v('paytype'),amount:+v('amount'),date:v('paydate'),reference:v('reference')});log(a,'Payment Logged',v('paytype')+' '+money(v('amount')));save()}
}render();</script></body></html>
