<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivilOps | Equipment Finances</title><style>body{font:15px system-ui;background:#0d1723;color:#eaf1f8;margin:0}header{padding:20px;background:#172b3d}main{max-width:1100px;margin:auto;padding:18px}a{color:#9acbff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#172b3d;border:1px solid #345;border-radius:12px;padding:16px;margin:12px 0}input,select{box-sizing:border-box;width:100%;padding:10px;background:#102337;color:white;border:1px solid #567;border-radius:7px;margin:6px 0 14px}button{padding:10px 14px;background:#1976d2;color:white;border:0;border-radius:8px;cursor:pointer}small{color:#aebdca}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #345;text-align:left}.metric{font-size:25px;font-weight:bold}.hide{display:none}label{font-size:13px;color:#bdcad7}</style></head><body><header><b>⚙ CIVILOPS</b> / Equipment Finances</header><main><p><a href="index.html">← Equipment Management</a></p><h1>Equipment Finances</h1><p><small>Demo: manually logged payments and projections stored only in this browser. Estimates use calendar days (weekly ÷ 7, monthly ÷ 30.4375), not actual rental contract billing rules.</small></p><label>Project</label><select id="project" onchange="selected='';render()"><option>Demo Solar</option><option>Demo BESS</option></select><div id="summary" class="grid"></div><div id="list"></div><div id="detail"></div></main><script>
const key='civilops-demo-v02';let items=JSON.parse(localStorage.getItem(key)||'[]');let selected='';const $=id=>document.getElementById(id), val=id=>$(id).value, money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}), date=s=>s?String(s).slice(0,10):'', today=()=>new Date().toISOString().slice(0,10), safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fin(e){return e.finance||(e.finance={rate:0,frequency:'Weekly',mob:0,demob:0,release:'',start:date(e.events.find(x=>x.type==='Call On')?.at)||today(),payments:[]})}function paid(f){return f.payments.reduce((a,p)=>a+Number(p.amount),0)}function days(a,b){return Math.max(0,Math.ceil((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000))}function forecast(e){let f=fin(e),off=e.events.find(x=>x.type==='Call Off'),end=off?date(off.at):f.release||today();let rental=f.frequency==='One-time'?+f.rate:+f.rate*days(f.start,end)/({Daily:1,Weekly:7,Monthly:30.4375}[f.frequency]||7);return rental+(+f.mob)+(+f.demob)}function save(){localStorage.setItem(key,JSON.stringify(items));render()}function render(){let list=items.filter(e=>e.project===val('project'));let p=list.reduce((n,x)=>n+paid(fin(x)),0),f=list.reduce((n,x)=>n+forecast(x),0);$('summary').innerHTML=[['Paid to Date',p],['Projected Total',f],['Projected Cost to Complete',f-p]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="metric">'+money(x[1])+'</div></div>').join('');$('list').innerHTML='<div class="card"><h2>Equipment Cost Forecast</h2><div style="overflow:auto"><table><tr><th>Equipment</th><th>Vendor</th><th>Projected release</th><th>Paid</th><th>Projected total</th><th>Remaining</th><th></th></tr>'+list.map(e=>'<tr><td>#'+safe(e.number)+' '+safe(e.name)+'</td><td>'+safe(e.vendor)+'</td><td>'+safe(fin(e).release||'Not set')+'</td><td>'+money(paid(fin(e)))+'</td><td>'+money(forecast(e))+'</td><td>'+money(forecast(e)-paid(fin(e)))+'</td><td><button onclick="openEquipment(\''+e.id+'\')">Manage</button></td></tr>').join('')+'</table></div></div>';if(selected){let e=list.find(x=>x.id===selected);if(e)details(e);else $('detail').innerHTML=''}}function openEquipment(id){selected=id;render();$('detail').scrollIntoView({behavior:'smooth'})}function details(e){let f=fin(e),off=e.events.find(x=>x.type==='Call Off'),depart=e.events.find(x=>x.type==='Pickup Confirmed');$('detail').innerHTML='<div class="card"><h2>#'+safe(e.number)+' — '+safe(e.name)+'</h2><p><small>Called off: '+safe(date(off?.at)||'No')+' · Departed: '+safe(date(depart?.at)||'No')+'</small></p><form id="settings"><div class="grid"><div><label>Rental rate ($)</label><input id="rate" type="number" min="0" step=".01" required value="'+f.rate+'"></div><div><label>Frequency</label><select id="frequency">'+['Daily','Weekly','Monthly','One-time'].map(x=>'<option '+(x===f.frequency?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>Billing start date</label><input id="start" type="date" required value="'+safe(f.start)+'"></div><div><label>Superintendent projected release date</label><input id="release" type="date" required value="'+safe(f.release||today())+'"></div><div><label>Mobilization cost ($)</label><input id="mob" type="number" min="0" step=".01" required value="'+f.mob+'"></div><div><label>Demobilization cost ($)</label><input id="demob" type="number" min="0" step=".01" required value="'+f.demob+'"></div></div><button>Save Cost Projection</button></form><h3>Log Actual Payment</h3><form id="payment"><div class="grid"><div><label>Payment category</label><select id="type"><option>Rental</option><option>Mobilization</option><option>Demobilization</option><option>Other</option></select></div><div><label>Amount paid ($)</label><input id="amount" type="number" min=".01" step=".01" required></div><div><label>Payment date</label><input id="paydate" type="date" required value="'+today()+'"></div><div><label>Billing period start (optional)</label><input id="from" type="date"></div><div><label>Billing period end (optional)</label><input id="to" type="date"></div><div><label>Invoice / payment reference</label><input id="reference"></div></div><button>Log Payment</button></form><h3>Payment History</h3><div style="overflow:auto"><table><tr><th>Paid</th><th>Category</th><th>Covered dates</th><th>Reference</th><th>Amount</th></tr>'+f.payments.map(p=>'<tr><td>'+safe(p.date)+'</td><td>'+safe(p.type)+'</td><td>'+safe(p.from||'—')+' – '+safe(p.to||'—')+'</td><td>'+safe(p.reference||'—')+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</table></div>'+(off?'<p><small>Review any rental payment periods that extend beyond call-off '+date(off.at)+' for possible overbilling.</small></p>':'')+'</div>';$('settings').onsubmit=ev=>{ev.preventDefault();if(val('release')<val('start'))return alert('Release must be after billing start');Object.assign(f,{rate:+val('rate'),frequency:val('frequency'),start:val('start'),release:val('release'),mob:+val('mob'),demob:+val('demob')});save()};$('payment').onsubmit=ev=>{ev.preventDefault();if(val('from')&&val('to')&&val('to')<val('from'))return alert('Invalid billing period');f.payments.push({type:val('type'),amount:+val('amount'),date:val('paydate'),from:val('from'),to:val('to'),reference:val('reference')});save()}}render();
</script></body></html>
