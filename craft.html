<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivilOps | Craft Inspection</title><style>body{font:16px system-ui;background:#0d1723;color:#edf3fa;margin:0}header{background:#172b3d;padding:18px}main{max-width:620px;margin:auto;padding:18px}.card{background:#172b3d;border:1px solid #345;border-radius:12px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 4px;color:#c6d2df}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;background:#102337;color:white;border:1px solid #567;border-radius:8px;font:inherit}button{background:#1976d2;color:white;border:0;border-radius:8px;padding:14px 18px;font:inherit;cursor:pointer;width:100%;margin-top:18px}.muted{color:#b8c7d5}.warning{background:#664426;padding:12px;border-radius:8px}</style></head><body><header><b>⚙ CIVILOPS</b> / Craft Daily Inspection</header><main><div id="app"></div></main><script>
const KEY='civilops-demo-v02',params=new URLSearchParams(location.search),id=params.get('id');let items=JSON.parse(localStorage.getItem(KEY)||'[]');let asset=items.find(x=>x.id===id);const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const today=()=>new Date().toLocaleDateString();const options='<option value="Pass">Pass</option><option value="Minor deficiency">Minor deficiency</option><option value="Fail — unsafe">Fail — unsafe</option>';if(!asset){$('app').innerHTML='<div class="card"><h2>Equipment not found on this device</h2><p class="warning">This prototype stores equipment only in the browser where it was created. QR scans from another phone cannot retrieve the machine until shared cloud storage is enabled.</p><a href="index.html" style="color:#9acbff">Back to Equipment</a></div>'}else{$('app').innerHTML='<div class="card"><h2>#'+esc(asset.number)+' — '+esc(asset.name)+'</h2><p class="muted">'+esc(asset.project)+' · '+esc(asset.crew)+' · '+today()+'</p><p>Current hour meter: <b>'+esc(asset.hours)+'</b></p>'+(asset.status==='Down'?'<p class="warning">This machine was already marked DOWN / OUT OF SERVICE. Follow site clearance procedures.</p>':'')+'<form id="inspection"><label>Craft member full name</label><input id="person" required autocomplete="name" placeholder="First and last name"><label>Hour meter reading at end of shift</label><input id="meter" type="number" min="'+Number(asset.hours)+'" step=".1" value="'+Number(asset.hours)+'" required><label>Hours operated this shift</label><input id="usage" type="number" min="0" step=".1" max="24" required placeholder="e.g. 6.5"><label>Scheduled shift hours (utilization denominator)</label><input id="shift" type="number" min=".5" max="24" step=".5" value="8" required>'+['Fluid leaks','Tracks / tires','Hydraulic lines','Lights / backup alarm','Seatbelt / cab','Guards / safety devices'].map((name,i)=>'<label>'+name+'</label><select id="check'+i+'">'+options+'</select>').join('')+'<label>Defect details / notes (required if any item fails)</label><textarea id="notes" rows="3" placeholder="Describe defect, location and action taken"></textarea><button>Submit Daily Inspection</button></form></div>';$('inspection').onsubmit=ev=>{ev.preventDefault();let person=$('person').value.trim(),meter=Number($('meter').value),usage=Number($('usage').value),shift=Number($('shift').value),checks=Array.from({length:6},(_,i)=>$('check'+i).value),fail=checks.some(x=>x==='Fail — unsafe'),issues=checks.some(x=>x!=='Pass'),notes=$('notes').value.trim();if(issues&&!notes)return alert('Describe the inspection deficiency');if(usage>shift&&!confirm('Usage exceeds scheduled shift hours. Submit anyway?'))return;if(meter<Number(asset.hours))return alert('Meter reading cannot be less than the previous reading');let utilization=Math.round(usage/shift*100),result=fail?'FAIL':issues?'PASS WITH DEFICIENCIES':'PASS';asset.hours=meter;asset.events.unshift({type:'Craft Daily Inspection',at:new Date().toISOString(),note:person+' · '+result+' · '+usage+' / '+shift+' hours ('+utilization+'% utilization) · Meter '+meter+' · '+checks.join(' / ')+(notes?' · '+notes:''),craft:person,result,usage,shift,utilization,meter,checks,notes});localStorage.setItem(KEY,JSON.stringify(items));$('app').innerHTML='<div class="card"><h2>Inspection submitted ✓</h2><p>'+esc(person)+' · '+result+'</p><p>Usage: '+usage+' hours · '+utilization+'% utilization</p>'+(fail?'<p class="warning">Inspection deficiency recorded. Notify supervision and follow site safety requirements.</p>':'')+'<p class="muted">Saved in this browser only. No cloud submission or supervisor notification yet.</p><a href="index.html" style="color:#9acbff">Back to Equipment</a></div>'}};</script></body></html>
